name: Build Paper 26.2 Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Java Version prüfen
        run: |
          java -version
          javac -version

      - name: Maven Build
        run: mvn -B -f "./WorldPlugin-Paper-26.2/pom.xml" clean package

      - name: Plugin JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: WorldPlugin-Paper-26.2
          path: "./WorldPlugin-Paper-26.2/target/WorldPlugin-*.jar"
