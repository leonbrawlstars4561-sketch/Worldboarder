name: Build Paper Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Build
        run: mvn -B -f WorldPlugin/pom.xml clean package

      - name: Plugin-JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: WorldPlugin
          path: WorldPlugin/target/WorldPlugin-*.jar

